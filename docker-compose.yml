services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENABLE_LOCAL_PORTFOLIO: "1"
      LOCAL_PORTFOLIO_BASE_DIR: /app/local-data
    volumes:
      - ./local-data:/app/local-data
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    restart: unless-stopped
